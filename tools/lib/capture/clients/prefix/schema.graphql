"""
A job is submitted either by a user or by a trusted publisher, never both.
"""
union BackgroundJobActor = BackgroundJobUserActor | BackgroundJobPublisherActor

"""
What runs a background job, and so how far its recorded status can be
trusted.
"""
enum BackgroundJobExecutionBackend {
  """
  A Temporal workflow runs the job, and `workflowId` identifies the exact
  run. For mirror jobs, the worker also fails a job whose workflow closed
  without finishing it.
  """
  TEMPORAL

  """
  A process outside Temporal ran the job and reported its own progress,
  e.g. a channel mirror launched by a Kubernetes CronJob. Nothing
  reconciles these reports: an active status is only the last report and
  may outlive a process that was killed. Never used to admit or block
  other runs.
  """
  STANDALONE
}

type BackgroundJobPageResult {
  items: [BackgroundJob!]!
  total: Int!
  pages: Int!
  current: Int!
}

