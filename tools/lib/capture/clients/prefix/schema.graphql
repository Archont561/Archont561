  channelRelationBasePath: String

  """The CEP-0042 `overrides` relation this channel declares."""
  channelRelationOverridesPath: String

  """
  Channels that declare this one as a relation. Their repodata embeds a
  path to it and has to be rebuilt.
  """
  dependentChannelPaths: [String!]!
  dependentChannelCount: Int!

  """Every channel whose repodata and shard indexes have to be rebuilt."""
  reindexedChannelPaths: [String!]!

  """The subdirs rebuilt for the moved channel."""
  reindexedSubdirs: [String!]!
}

"""One condition the move runs into."""
type ChannelNamespaceMoveFinding {
  code: ChannelNamespaceMoveFindingCode!
  severity: ChannelNamespaceMoveSeverity!

  """Human-readable detail. Read the `code` to branch on, not this."""
  message: String!
  resolution: ChannelNamespaceMoveResolution!
}

"""The condition a finding reports. Codes are stable; the message is not."""
enum ChannelNamespaceMoveFindingCode {
  """The channel already lives in the requested namespace."""
  ALREADY_IN_TARGET_NAMESPACE

  """Mirrored channels are managed by their upstream and cannot be moved."""
  CHANNEL_IS_MIRRORED

  """Another channel in the target namespace already uses this local name."""
  LOCAL_NAME_CONFLICT

  """The target namespace already has a primary channel."""
  TARGET_NAMESPACE_HAS_PRIMARY

  """The existing target primary would be demoted to its scoped path."""
  EXISTING_PRIMARY_DEMOTED

  """The source namespace's bare path is left unclaimed by the move."""
  SOURCE_NAMESPACE_LOSES_PRIMARY

  """A public channel cannot live in a private group's namespace."""
  PUBLIC_CHANNEL_IN_PRIVATE_GROUP

  """The target namespace has no billing account to move the channel onto."""
  TARGET_BILLING_OWNER_MISSING

  """The target's billing account cannot pay for the channel."""
  TARGET_BILLING_OWNER_CANNOT_PAY

  """A quota on the target account would be exceeded after the move."""
  QUOTA_EXCEEDED
}

