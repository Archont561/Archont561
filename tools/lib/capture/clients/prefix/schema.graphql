"""
A billing account: what a user or a group is subscribed to, and what that
subscription is being used for. Readable by the user it belongs to, by the
Owners of the group it belongs to, and by site admins.
"""
type BillingAccount {
  """
  Opaque identifier. Stable for the life of the account; not derived
  from any name.
  """
  id: ID!

  """The user or group this account bills for."""
  principal: Owner

  """The account's subscription, or null when it has never held one."""
  subscription: SubscriptionWithStripeDetails

  """
  The plan the account's subscription is on, with its quotas. Null
  without a subscription.
  """
  plan: Plan

  """
  What the account currently uses against each quota of its plan. This
  is actual usage only; the projected usage of a pending namespace move
  is reported by the move's preview, not here.
  """
  usage: Usages!

  """
  The channels billed to this account, wherever they live: the ones in
  the principal's own namespace, plus those of any namespace an admin
  has pointed at it. This is what `usage` counts. Largest first unless
  ordered otherwise; pages of at most fifty.
  """
  channels(filters: ChannelFilter, orderBy: ChannelOrderBy, limit: Int, page: Int): ChannelPageResult!

  """The plan change awaiting confirmation on this account, if any."""
  pendingPlanChange: PendingPlanChangeDetails
}

