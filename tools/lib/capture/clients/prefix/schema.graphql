A principal whose access to the channel changes because the namespace does.
"""
type ChannelNamespaceMoveInheritedAccess {
  userName: String!

  """
  The role in the namespace's group. A user-backed namespace has exactly
  one principal, reported as `OWNER`.
  """
  namespaceRole: GroupMemberRole!

  """What that namespace role grants on a channel in the namespace."""
  channelRole: ChannelMemberRole!

  """
  Whether a direct channel membership survives the move regardless, in
