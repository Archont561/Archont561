  """
  isPublic: Boolean

  """
  Whether the principal has an `owner` row yet. A namespace that has
  never held a channel or paid for anything does not.
  """
  hasOwnerRecord: Boolean!
}

"""The full answer."""
type ChannelNamespaceMovePreview {
  """
  Fingerprint of apply-precondition facts.
  
  Hand it back to apply, which recomputes it under its own locks and
  refuses a mismatch. It fingerprints apply-precondition identity,
  visibility, ownership, primary-conflict, and mirror facts. Advisory
  usage, membership/access, and derived/reindex facts are excluded; apply
  re-derives them under its transaction and WEB-365 refreshes after
  success.
  """
  token: String!
  previewedAt: DateTime!

  """
  Whether the move has no blocking findings. Quota overages do not block:
  a site admin may exceed a configured ceiling.
  """
  canApply: Boolean!
  findings: [ChannelNamespaceMoveFinding!]!
  identity: ChannelNamespaceMoveIdentity!
  billing: ChannelNamespaceMoveBilling!
  access: ChannelNamespaceMoveAccess!
  derivedState: ChannelNamespaceMoveDerivedState!
}

"""What the caller can do about a finding."""
enum ChannelNamespaceMoveResolution {
  """
  Nothing the caller can pass; the conflicting state has to change first.
  """
  UNAVAILABLE

  """
  Re-request with `replaceExistingPrimary: true` to demote the target's
  current primary to its scoped path.
  """
  REPLACE_EXISTING_PRIMARY

  """
  Re-request with `makePrimary: false` to land the channel at
  `namespace/name` and leave the target's bare path alone.
  """
  MOVE_AS_SCOPED_CHANNEL

  """Make the channel private before moving it into a private group."""
  MAKE_CHANNEL_PRIVATE

  """Give the target namespace a billing account that holds a payable plan."""
  FIX_TARGET_BILLING

  """
  A site admin may apply the move past a configured ceiling; the
  subscription requirement still applies.
  """
  ADMIN_QUOTA_OVERRIDE
}

"""Whether a finding stops the move or merely qualifies it."""
enum ChannelNamespaceMoveSeverity {
  """The move cannot be applied while this holds."""
  BLOCKER

  """
  The move can be applied; this is a consequence the reviewer should see.
  """
  WARNING
}

