  """
  retainsDirectMembership: Boolean!
}

"""A direct channel membership, which the move leaves untouched."""
type ChannelNamespaceMoveMembership {
  userName: String!
  role: ChannelMemberRole!
}

"""One side of the move."""
type ChannelNamespaceMoveNamespace {
  """Normalized namespace name, as it appears in a channel path."""
  name: String!
  kind: ChannelNamespaceKind!

  """
  Group visibility. Null for a user-backed namespace, which is never a
