"""Who reaches the channel before and after."""
type ChannelNamespaceMoveAccess {
  """
  Direct `channel_member` rows. These are keyed on the channel and are
  unaffected by the move.
  """
  directMemberships: [ChannelNamespaceMoveMembership!]!
  directMembershipCount: Int!

  """Principals that reach the channel only through the source namespace."""
  inheritedAccessLost: [ChannelNamespaceMoveInheritedAccess!]!
  inheritedAccessLostCount: Int!

  """Principals that would reach the channel through the target namespace."""
  inheritedAccessGained: [ChannelNamespaceMoveInheritedAccess!]!
  inheritedAccessGainedCount: Int!
}

"""Which account pays before and after, and what that costs the target."""
type ChannelNamespaceMoveBilling {
  """The account billed for the channel today."""
  currentAccount: Owner

  """
  The account that would be billed afterwards: a user namespace bills to
  that user, a group namespace to the group's payer.
  """
  targetAccount: Owner

  """Whether this move creates billed growth requiring admission."""
  billingAdmissionRequired: Boolean!

  """
  Whether required billed-growth admission was checked. This is false for
  a genuine payer-preserving no-op.
  """
  billingAdmissionChecked: Boolean!

  """
  Whether required admission succeeded; null when admission was not needed.
  """
  billingAdmissionSatisfied: Boolean

  """
  Why required billed-growth admission was refused, including when no
  payer exists against which the required check can run.
  """
  billingAdmissionRefusal: String

  """
  Bytes the channel brings with it.
  
  This is the channel's size, which is what moves. It is not necessarily
  what the target account gains: a channel already billed to that account
  stays billed to it, so the move costs it nothing. Compare `quotas`.
  """
  transferredSize: Int!

  """
  Complete constraint inventory applicable to this move's target billing
  change. It includes unqualified rows and affected visibility scopes for
  CHANNELS, STORAGE, and MEMBERS, with explicit configured/unlimited
  policy state, actual current/projected usage, and verdicts. PACKAGE_SIZE
  and GROUP_MEMBERS are absent because moving an existing channel changes
  neither measured value.
  
  Convenient target-account alias for `quotaForecast.accounts` rows. It
  is derived from the same forecast and never replaces the complete result.
  """
  quotas: [QuotaProjection!]!

  """
  Reusable forecast output containing every affected billing account,
  including both source releases and target growth.
  """
  quotaForecast: QuotaForecast!
}

