  """The channel's local name, which the move does not change."""
  localName: String!
  currentPath: String!

  """
  Where the channel would be served from, assuming the request's
  `makePrimary`.
  """
  resultingPath: String!
  currentNamespace: ChannelNamespaceMoveNamespace!
  targetNamespace: ChannelNamespaceMoveNamespace!
  isPrimaryInCurrentNamespace: Boolean!
  becomesPrimaryInTargetNamespace: Boolean!

  """The channel currently holding the target namespace's bare path."""
  targetNamespacePrimaryPath: String

  """Where that channel ends up if the move demotes it."""
  demotedPrimaryPath: String

  """The target-namespace channel already using this local name."""
  conflictingChannelPath: String

  """Whether the source namespace's bare path is left unclaimed."""
  sourceNamespaceLosesPrimary: Boolean!
}

