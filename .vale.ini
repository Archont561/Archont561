# Local Vale config pointing at the vendored polyglot-clean-code Pedantic styles.
# Never edit vendor/clean-code-presets; override here instead.
StylesPath = vendor/clean-code-presets/vale/styles/pedantic
MinAlertLevel = suggestion
Vocab = Project

[*.md]
# Repository slugs (link text, card alt text and GitHub paths) keep their real casing, e.g. pixi-sandbox.
TokenIgnores = (\[[a-z0-9]+(?:-[a-z0-9]+)+\]), (alt="[a-z0-9]+(?:-[a-z0-9]+)+:), (Archont561/[A-Za-z0-9._-]+)
BasedOnStyles = PCC
PCC.Terms = YES
PCC.Spacing = YES
PCC.Weasel = YES
PCC.Links = YES
PCC.Placeholders = YES
PCC.Headings = YES
