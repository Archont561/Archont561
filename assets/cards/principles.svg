<svg xmlns="http://www.w3.org/2000/svg" width="728" height="236" viewBox="0 0 728 236" role="img" aria-labelledby="t d">
<title id="t">$ ./principles --show</title>
<desc id="d">lock: same lockfile, same result (Pixi + Conda lockfiles, SHA-pinned actions); test: test behaviour, not lines (Gherkin specs, property tests, a 90% floor); document: docs ship with the code (llms.txt and .md routes for agents); ship: small commits, green gate first (conventional commits, no force-push); enforce: if a machine can check it, it does (ast-grep, Alint, Vale, commitlint). Lock it, test it, document it, then ship it.</desc>
